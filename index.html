<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
  label { display: block; margin-top: 15px; font-weight: bold; }
  select, input { width: 100%; padding: 10px; margin-top: 5px; font-size: 16px; }
  button { margin-top: 25px; width: 100%; padding: 15px; font-size: 18px;
           background: #2ecc71; color: white; border: none; border-radius: 8px; }
  button:active { background: #27ae60; }
</style>
</head>
<body>

<h2>Machine Status</h2>

<label>Team</label>
<select id="team">
  <option>A</option><option>B</option><option>C</option><option>D</option>
</select>

<label>Machine Name</label>
<input type="text" id="machineName">

<label>Machine No</label>
<input type="text" id="machineNo">

<label>Machine Part</label>
<select id="machinePart">
  <option>Roll Feeding Part</option>
  <option>Liner Part</option>
  <option>Cutting Part</option>
  <option>Conveyor Part</option>
</select>

<button onclick="submitForm()">✅ Completed</button>

<p id="status"></p>

<script>
function submitForm() {
  var url = "https://script.google.com/macros/s/AKfycbzSLFB2ocbATEQ2s57lSWAD9f2XBE6pU6NaaWcInFdQQjW5ED_aQcPOYEMhAA0j_i9E/exec";

  var payload = {
    team: document.getElementById("team").value,
    machineName: document.getElementById("machineName").value,
    machineNo: document.getElementById("machineNo").value,
    machinePart: document.getElementById("machinePart").value
  };

  document.getElementById("status").innerText = "Sending...";

  fetch(url, {
    method: "POST",
    body: JSON.stringify(payload)
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("status").innerText = "✅ Sent: " + data.message;
  })
  .catch(err => {
    document.getElementById("status").innerText = "❌ Error, try again";
  });
}
</script>

</body>
</html>
